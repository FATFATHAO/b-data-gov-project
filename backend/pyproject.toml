[project]
name = "b-data-gov-project"
version = "0.1.0"
description = "B-DataGov Lite — B站数据治理与可视化平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "duckdb>=1.5.0",
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "bilibili-api-python>=17.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    # Spark Dependencies
    "pyspark>=3.5.0",
    "redis>=5.0.0",
    "jieba>=0.42.1",
    "snownlp>=0.12.2",
    "pyarrow",
    # Kafka & Config
    "kafka-python>=2.0.2",
    "python-dotenv>=1.0.0",
    "curl-cffi>=0.15.0",
]
